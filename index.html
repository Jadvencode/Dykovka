
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Heroes III - Dykovka</title>

    <!-- Fantasy písmo -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Veškerý vzhled stránky -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- =====================================
         VSTUPNÍ BRÁNA – HESLO CECHU
         ===================================== -->

    <div id="vstupniBrana" class="hlavni-panel">

        <img
            class="logo"
            src="Heroes_3.png"
            alt="Heroes III Board Game">

        <h1>⚔ Vstup do cechu ⚔</h1>

        <p class="podnadpis">
            Pouze vyvolení hrdinové znají tajné heslo...
        </p>

        <div class="formular">

            <label for="hesloCechu">Heslo cechu:</label>

            <input
                type="password"
                id="hesloCechu"
                placeholder="Zadej tajné heslo">

            <button type="button" onclick="overHeslo()">
                ⚔ Vstoupit do cechu
            </button>

        </div>

        <p id="chybaHesla"></p>

    </div>


    <!-- =====================================
         HLAVNÍ APLIKACE DÝKOVKA
         ===================================== -->

    <main class="hlavni-panel" id="aplikace" style="display: none;">

        <img
            class="logo"
            src="Heroes_3.png"
            alt="Heroes III Board Game">

        <h1>Přihlášení na Dykovku </h1>

        <p class="podnadpis">
            Osud hrdinů se rozhoduje právě zde ...
        </p>

        <div class="oddeleni">
            ⚔ Zápiš se do cechu dobrodruhů a buď u toho 15-17.01.2027 ⚔
        </div>


        <!-- REGISTRACE HRÁČE -->

        <div class="formular">

            <label for="jmeno">Jméno hrdiny:</label>

            <input
                type="text"
                id="jmeno"
                placeholder="Jak ti říkají v království?">

            <label for="pobyt">Délka pobytu:</label>

            <select id="pobyt">
                <option value="1">Jeden den</option>
                <option value="2">Celý víkend</option>
            </select>

            <button type="button" onclick="prihlasitHrace()">
                ⚔ Přihlásit hrdinu
            </button>

        </div>

        <!-- Zpráva po přihlášení -->
        <p id="zprava"></p>


        <!-- =====================================
             NÁSTĚNKA HRDINŮ
             ===================================== -->

        <div class="nastenka-hrdinu">

            <!-- Hráče sem vykresluje dy kovka.js -->
            <ul id="seznamHracu"></ul>

        </div>


        <!-- PATIČKA -->

        <p class="paticka">
            Dýkovka • Heroes III Board Game • Ať tě provází štěstí!
        </p>

    </main>


    <!-- Knihovna Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Naše funkce -->
    <script src="dykovka.js"></script>

</body>
</html>
