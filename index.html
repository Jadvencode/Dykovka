
<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heroes III - Dykovka</title>

    <link rel="stylesheet" href="style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 35px 16px;
            color: #ead9ad;
            font-family: Georgia, "Times New Roman", serif;

            background:
                radial-gradient(ellipse at top, #344b38 0%, transparent 55%),
                linear-gradient(135deg, #101710, #20271d 50%, #100f0b);
        }

        .hlavni-panel {
            max-width: 850px;
            margin: 0 auto;
            padding: 28px;
            text-align: center;

            background: linear-gradient(145deg, #29291f, #171a14);
            border: 3px solid #8d6b32;
            outline: 1px solid #c5a45d;
            outline-offset: -9px;
            box-shadow: 0 12px 35px #000b;
        }

        .logo {
            display: block;
            width: 100%;
            max-width: 700px;
            height: auto;
            margin: 0 auto 25px;
            border: 2px solid #8d6b32;
            box-shadow: 0 5px 18px #0009;
        }

        h1 {
            margin: 15px 0 10px;
        font-family: "Cinzel", Georgia, serif;
        color: #e6c16d;
        font-size: clamp(27px, 5vw, 40px);
        text-shadow: 2px 3px 4px #000;
        }

        .podnadpis {
            margin-bottom: 28px;
            color: #b9ad8d;
            font-style: italic;
        }

        .oddeleni {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 25px 0;
            color: #bd9850;
        }

        .oddeleni::before,
        .oddeleni::after {
            content: "";
            height: 1px;
            flex: 1;
            background: linear-gradient(
                to right, transparent, #a7823e, transparent
            );
        }

        .formular {
            max-width: 510px;
            margin: 0 auto;
            padding: 24px;
            text-align: left;

            background: linear-gradient(135deg, #ded0a7, #bba77b);
            border: 3px ridge #98783d;
            color: #302518;
            box-shadow: inset 0 0 20px #72572b55;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 2px solid #786039;
            background: #f0e6ca;
            color: #292116;
            font-family: inherit;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: 2px solid #76511e;
            outline-offset: 2px;
        }

        button {  
        padding: 11px 17px;
        border: 2px solid #d6b76c;
        border-radius: 3px;
        color: #fff0c5;
        font-family: "Cinzel", Georgia, serif;
            font-weight: bold;
        cursor: pointer;

        background: linear-gradient(#79602d, #3b2b16);
        box-shadow: inset 0 1px 0 #ffffff30,
                0 3px 5px #0006;

        transition: background 0.2s, color 0.2s;
        }

        button:hover {
        background: linear-gradient(#a0803c, #59401e);
        color: white;
        }


        .formular button {
            width: 100%;
            padding: 14px;
            font-size: 17px;
        }

        #zprava {
            min-height: 24px;
            margin: 20px 0;
            color: #f0d17e;
            font-weight: bold;
        }

        h2 {
        font-family: "Cinzel", Georgia, serif;
        color: #e6c16d;
        text-shadow: 2px 2px 4px #000;
        letter-spacing: 1px;
        }

        #seznamHracu {
            list-style: none;
            padding: 0;
            margin: 20px 0 0;
            text-align: left;
        }

        #seznamHracu li {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 12px 0;
        padding: 15px;

        color: #382713;
        font-family: Georgia, "Times New Roman", serif;
        font-size: 16px;

        background:
            linear-gradient(110deg, #f0dfb5, #c9b17e);

        border: 3px ridge #98783d;
        box-shadow:
            inset 0 0 12px #8b672b55,
            0 4px 8px #0008;
        }

        #seznamHracu li button {
            flex-shrink: 0;
            padding: 7px 10px;
            font-size: 13px;
        }

        .paticka {
            margin-top: 30px;
            color: #8f896e;
            font-size: 13px;
            font-style: italic;
        }

        @media (max-width: 500px) {
            body {
                padding: 18px 10px;
            }

            .hlavni-panel {
                padding: 20px 14px;
            }

            .formular {
                padding: 17px;
            }

            #seznamHracu li {
                padding: 10px;
                font-size: 14px;
            }
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="hlavni-panel">

        <img
            class="logo"
            src="Heroes_3.png"
            alt="Heroes III Board Game">

        <h1>Přihlášení na Dykovku</h1>

        <p class="podnadpis">
            Osud hrdinů se rozhoduje právě zde...
        </p>

        <div class="oddeleni">⚔ Zápiš se do cechu dobrodruhů ⚔</div>

        <div class="formular">

            <label for="jmeno">Jméno hrdiny:</label>
            <input
                type="text"
                id="jmeno"
                placeholder="Jak ti říkají v království?">

            <label for="pobyt">Délka pobytu:</label>
            <select id="pobyt">
                <option value="1">Jeden den</option>
                <option value="2">Celý víkend</option>
            </select>

            <button onclick="prihlasitHrace()">
                ⚔ Přihlásit hrdinu
            </button>

        </div>

        <p id="zprava"></p>

        <div class="oddeleni">📜 Kronika přihlášených hrdinů 📜</div>

    
        <ul id="seznamHracu"></ul>

        <p class="paticka">
            Dýkovka • Heroes III Board Game • Ať tě provází štěstí!
        </p>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="dykovka.js"></script>
    

</body>
</html>
